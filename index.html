<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Help the Heart</title>
<style>
html,body{
margin:0;
padding:0;
overflow:hidden;
font-family:monospace;
background:black;
}
canvas{display:block;}

.overlay{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.65);
color:white;
text-align:center;
z-index:10;
}

.hidden{display:none;}

button{
padding:12px 22px;
margin:10px;
font-size:16px;
cursor:pointer;
}

#ui{
position:fixed;
top:10px;
left:10px;
color:white;
font-size:14px;
z-index:5;
text-shadow:2px 2px 0px black;
}

#message{
margin-top:20px;
max-width:300px;
}
</style>
</head>
<body>

<div id="ui" class="hidden">
<div>⏱ <span id="time">0</span>s</div>
<div>⬆ <span id="height">0</span>m</div>
</div>

<div id="menu" class="overlay">
<h1>Help the Heart ❤️</h1>
<p>Помоги сердечку добраться до поздравления!</p>
<button onclick="startGame()">Играть</button>
<button onclick="enableTilt()">Включить наклон</button>
</div>

<div id="gameOver" class="overlay hidden">
<h1>Game Over 💔</h1>
<button onclick="resetGame()">Попробовать снова</button>
</div>

<div id="win" class="overlay hidden">
<h1>Ты добрался! ❤️</h1>
<div id="message">
ТВОЙ ТЕКСТ ПОЗДРАВЛЕНИЯ
</div>
<button onclick="resetGame()">Сыграть снова</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;
canvas.height=innerHeight;

let state="menu";
let gravity=0.45;
let jumpForce=-11;
let moveSpeed=4;
let player,platforms,particles;
let cameraY=0;
let keys={};
let useTilt=false;
let tiltX=0;
let startTime=0;
let levelHeight=7000;
let maxHeight=0;

function showScreen(name){
document.getElementById("menu").classList.add("hidden");
document.getElementById("gameOver").classList.add("hidden");
document.getElementById("win").classList.add("hidden");
document.getElementById("ui").classList.add("hidden");

if(name==="menu") document.getElementById("menu").classList.remove("hidden");
if(name==="gameover") document.getElementById("gameOver").classList.remove("hidden");
if(name==="win") document.getElementById("win").classList.remove("hidden");
if(name==="playing") document.getElementById("ui").classList.remove("hidden");
}

function createPlayer(){
return{
x:canvas.width/2-8,
y:canvas.height-100,
vy:0,
size:16
};
}

function generateLevel(){
let arr=[];
let y=canvas.height;
while(y>-levelHeight){
let type=Math.random();
let p={
x:Math.random()*(canvas.width-60),
y:y,
width:60,
height:10,
type:"normal",
vx:0,
broken:false
};
if(type<0.2){p.type="moving";p.vx=2;}
else if(type<0.35){p.type="break";}
arr.push(p);
y-=80+Math.random()*40;
}
arr.push({
x:canvas.width/2-70,
y:-levelHeight-100,
width:140,
height:20,
type:"final"
});
return arr;
}

function startGame(){
player=createPlayer();
platforms=generateLevel();
particles=[];
cameraY=0;
maxHeight=0;
startTime=Date.now();
state="playing";
showScreen("playing");
}

function resetGame(){
state="menu";
showScreen("menu");
}

function enableTilt(){
if(typeof DeviceOrientationEvent!=="undefined" &&
typeof DeviceOrientationEvent.requestPermission==="function"){
DeviceOrientationEvent.requestPermission().then(r=>{
if(r==="granted") useTilt=true;
});
}else{
useTilt=true;
}
}

window.addEventListener("deviceorientation",e=>{
tiltX=e.gamma/15;
});

window.addEventListener("keydown",e=>keys[e.key]=true);
window.addEventListener("keyup",e=>keys[e.key]=false);

function spawnParticles(x,y,count=6){
for(let i=0;i<count;i++){
particles.push({
x:x,
y:y,
vx:(Math.random()-0.5)*4,
vy:(Math.random()-1)*4,
life:30
});
}
}

function update(){
if(state!=="playing") return;

player.vy+=gravity;
player.y+=player.vy;

let move=0;
if(useTilt) move=tiltX;
else{
if(keys["ArrowLeft"]) move=-1;
if(keys["ArrowRight"]) move=1;
}
player.x+=move*moveSpeed;

if(player.x<0)player.x=canvas.width;
if(player.x>canvas.width)player.x=0;

for(let p of platforms){
if(p.type==="moving"){
p.x+=p.vx;
if(p.x<0||p.x+p.width>canvas.width)p.vx*=-1;
}

if(player.vy>0 &&
player.x+player.size>p.x &&
player.x<p.x+p.width &&
player.y+player.size>p.y &&
player.y+player.size<p.y+p.height+player.vy){

if(p.type==="break"&&!p.broken){
p.broken=true;
spawnParticles(p.x+p.width/2,p.y,10);
}
if(!p.broken){
player.vy=jumpForce;
spawnParticles(player.x+8,player.y+16);
}
if(p.type==="final"){
state="win";
showScreen("win");
}
}
}

if(player.y<canvas.height/2){
cameraY+=canvas.height/2-player.y;
player.y=canvas.height/2;
}

if(player.y-cameraY>canvas.height){
state="gameover";
showScreen("gameover");
}

particles.forEach(p=>{
p.x+=p.vx;
p.y+=p.vy;
p.life--;
});
particles=particles.filter(p=>p.life>0);

let worldHeight=cameraY;
if(worldHeight>maxHeight) maxHeight=worldHeight;

document.getElementById("time").innerText=
Math.floor((Date.now()-startTime)/1000);
document.getElementById("height").innerText=
Math.floor(maxHeight/100);
}

function drawHeart(x,y){
ctx.fillStyle="red";
let s=2;
let px=[[1,0],[2,0],[4,0],[5,0],
[0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],
[0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[6,2],
[1,3],[2,3],[3,3],[4,3],[5,3],
[2,4],[3,4],[4,4],
[3,5]];
for(let p of px){
ctx.fillRect(x+p[0]*s,y+p[1]*s,s,s);
}
}

function drawBackground(){
let progress=Math.min(cameraY/levelHeight,1);
let grad=ctx.createLinearGradient(0,0,0,canvas.height);

if(progress<0.33){
grad.addColorStop(0,"#ffb6c1");
grad.addColorStop(1,"#ffc0cb");
}else if(progress<0.66){
grad.addColorStop(0,"#b19cd9");
grad.addColorStop(1,"#8a2be2");
}else{
grad.addColorStop(0,"#000010");
grad.addColorStop(1,"#000000");
}

ctx.fillStyle=grad;
ctx.fillRect(0,0,canvas.width,canvas.height);
}

function draw(){
drawBackground();

ctx.save();
ctx.translate(0,-cameraY);

for(let p of platforms){
if(p.type==="break"&&p.broken) continue;

if(p.type==="moving") ctx.fillStyle="#00ffcc";
else if(p.type==="break") ctx.fillStyle="#ffcc00";
else if(p.type==="final") ctx.fillStyle="#00ff00";
else ctx.fillStyle="white";

ctx.fillRect(p.x,p.y,p.width,p.height);
}

drawHeart(player.x,player.y);

ctx.restore();

ctx.fillStyle="red";
particles.forEach(p=>{
ctx.fillRect(p.x,p.y-cameraY,3,3);
});
}

function loop(){
update();
draw();
requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
