<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Help the Heart</title>
<style>
html,body{
margin:0;
padding:0;
overflow:hidden;
font-family:monospace;
background:black;
}
canvas{display:block;}
.overlay{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.65);
color:white;
text-align:center;
z-index:10;
}
.hidden{display:none;}
button{
padding:12px 22px;
margin:10px;
font-size:16px;
cursor:pointer;
border:1px solid white;
background:rgba(255,255,255,0.1);
color:white;
border-radius:8px;
}
button:active{background:rgba(255,255,255,0.3);}
#ui{
position:fixed;
top:10px;
left:10px;
color:white;
font-size:14px;
z-index:5;
text-shadow:2px 2px 0px black;
}
#message{
margin-top:20px;
max-width:300px;
}
#touchControls{
position:fixed;
bottom:20px;
left:20px;
right:20px;
display:none;
justify-content:space-between;
z-index:15;
}
#touchControls button{
width:80px;
height:80px;
font-size:30px;
background:rgba(255,255,255,0.2);
border:none;
border-radius:50%;
color:white;
touch-action:manipulation;
}
#touchControls button:active{
background:rgba(255,255,255,0.5);
}
@media (max-width:768px){
#touchControls{display:flex;}
}
</style>
</head>
<body>
<div id="ui" class="hidden">
<div>⏱ <span id="time">0</span>s</div>
<div>⬆ <span id="height">0</span>m</div>
</div>
<div id="menu" class="overlay">
<h1>Help the Heart ❤️</h1>
<p>Помоги сердечку добраться до поздравления!</p>
<button onclick="startGame()">Играть</button>
</div>
<div id="gameOver" class="overlay hidden">
<h1>Game Over 💔</h1>
<button onclick="resetGame()">Попробовать снова</button>
</div>
<div id="win" class="overlay hidden">
<h1>Ты добрался! ❤️</h1>
<div id="message">
ТВОЙ ТЕКСТ ПОЗДРАВЛЕНИЯ
</div>
<button onclick="resetGame()">Сыграть снова</button>
</div>
<div id="touchControls">
<button id="btnLeft">←</button>
<div></div>
<button id="btnRight">→</button>
</div>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let state = "menu";
let gravity = 0.5;
let jumpForce = -12;
let moveSpeed = 5;
let player, platforms, particles = [];
let cameraY = 0;
let keys = {};
let useTilt = false;
let tiltX = 0;
let startTime = 0;
let startBottomY = 0;
let levelHeight = 8000;
let touchLeft = false;
let touchRight = false;

function resizeCanvas() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function showScreen(name) {
  ['menu', 'gameOver', 'win', 'ui'].forEach(id => {
    document.getElementById(id === 'ui' ? 'ui' : id).classList.add('hidden');
  });
  if (name === 'menu') document.getElementById('menu').classList.remove('hidden');
  if (name === 'gameover') document.getElementById('gameOver').classList.remove('hidden');
  if (name === 'win') document.getElementById('win').classList.remove('hidden');
  if (name === 'playing') document.getElementById('ui').classList.remove('hidden');
}

function createPlayer() {
  return {
    x: canvas.width / 2 - 8,
    y: canvas.height - 120,
    vy: 0,
    size: 16
  };
}

function generateLevel() {
  let arr = [];
  let y = canvas.height - 80;
  // Первая платформа под игроком
  arr.push({
    x: canvas.width / 2 - 30,
    y: y,
    width: 60,
    height: 12,
    type: 'normal',
    vx: 0,
    broken: false
  });
  y -= 80 + Math.random() * 40;
  while (y > -levelHeight) {
    let type = Math.random();
    let width = 40 + Math.random() * 50;
    let p = {
      x: 20 + Math.random() * (canvas.width - width - 40),
      y: y,
      width: width,
      height: 12,
      type: 'normal',
      vx: 0,
      broken: false
    };
    if (type < 0.15) {
      p.type = 'moving';
      p.vx = (Math.random() < 0.5 ? -1 : 1) * (1.5 + Math.random() * 1.5);
      p.width = 50;
      p.x = 20 + Math.random() * (canvas.width - p.width - 40);
    } else if (type < 0.32) {
      p.type = 'break';
    }
    arr.push(p);
    y -= 75 + Math.random() * 45;
  }
  // Финальная платформа широкая по центру
  arr.push({
    x: (canvas.width - 400) / 2,
    y: -levelHeight - 80,
    width: 400,
    height: 25,
    type: 'final'
  });
  return arr;
}

function startGame() {
  player = createPlayer();
  platforms = generateLevel();
  particles = [];
  cameraY = 0;
  startBottomY = player.y;
  startTime = Date.now();
  state = 'playing';
  useTilt = true;
  enableTilt();
  showScreen('playing');
}

function resetGame() {
  state = 'menu';
  showScreen('menu');
}

function enableTilt() {
  if (typeof DeviceOrientationEvent === 'undefined') return;
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(result => {
      if (result === 'granted') {
        window.addEventListener('deviceorientation', handleTilt);
      }
    }).catch(console.error);
  } else {
    window.addEventListener('deviceorientation', handleTilt);
  }
}

function handleTilt(e) {
  tiltX = (e.gamma || 0) / 12; // Чувствительность
}

window.addEventListener('deviceorientation', handleTilt);
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// Touch controls
document.getElementById('btnLeft').addEventListener('touchstart', e => { e.preventDefault(); touchLeft = true; }, { passive: false });
document.getElementById('btnLeft').addEventListener('touchend', e => { e.preventDefault(); touchLeft = false; }, { passive: false });
document.getElementById('btnRight').addEventListener('touchstart', e => { e.preventDefault(); touchRight = true; }, { passive: false });
document.getElementById('btnRight').addEventListener('touchend', e => { e.preventDefault(); touchRight = false; }, { passive: false });

function spawnParticles(x, y, count = 6) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 1) * 5,
      life: 35
    });
  }
}

function update() {
  if (state !== 'playing') return;

  // Обновление платформ
  for (let p of platforms) {
    if (p.type === 'moving') {
      p.x += p.vx;
      if (p.x < 10 || p.x + p.width > canvas.width - 10) p.vx *= -1;
    }
  }

  player.vy += gravity;
  const prevBottom = player.y + player.size;
  player.y += player.vy;

  // Столкновения
  for (let p of platforms) {
    if (player.vy > 0 &&
        player.x + player.size > p.x &&
        player.x < p.x + p.width &&
        prevBottom <= p.y &&
        player.y + player.size > p.y) {
      // Приземление
      player.y = p.y - player.size;
      player.vy = jumpForce;
      spawnParticles(player.x + 8, player.y + 16, 8);

      if (p.type === 'break' && !p.broken) {
        p.broken = true;
        spawnParticles(p.x + p.width / 2, p.y, 12);
      }

      if (p.type === 'final') {
        state = 'win';
        showScreen('win');
        return;
      }
    }
  }

  // Управление
  let moveX = useTilt ? Math.max(-1, Math.min(1, tiltX)) : 0;
  if (keys['arrowleft'] || keys['a'] || touchLeft) moveX = Math.max(-1, moveX - 1);
  if (keys['arrowright'] || keys['d'] || touchRight) moveX = Math.min(1, moveX + 1);
  player.x += moveX * moveSpeed;

  // Телепорт по краям
  if (player.x < -player.size) player.x = canvas.width;
  if (player.x > canvas.width) player.x = -player.size;

  // Камера (плавная)
  const targetCameraY = player.y - canvas.height * 0.4;
  cameraY += (targetCameraY - cameraY) * 0.15;

  // Game Over
  if (player.y > cameraY + canvas.height * 1.3) {
    state = 'gameover';
    showScreen('gameover');
  }

  // Частицы
  for (let p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.2;
    p.life--;
  }
  particles = particles.filter(p => p.life > 0);

  // UI
  document.getElementById('time').innerText = Math.floor((Date.now() - startTime) / 1000);
  const currentHeight = Math.floor((startBottomY - player.y) / 10);
  document.getElementById('height').innerText = currentHeight;
}

function drawHeart(x, y) {
  ctx.fillStyle = 'red';
  const s = 2;
  const px = [[1,0],[2,0],[4,0],[5,0],[0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[6,2],[1,3],[2,3],[3,3],[4,3],[5,3],[2,4],[3,4],[4,4],[3,5]];
  for (let p of px) {
    ctx.fillRect(x + p[0] * s, y + p[1] * s, s, s);
  }
}

function drawBackground() {
  const progress = Math.min(1, (startBottomY - player.y) / levelHeight);
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  if (progress < 0.33) {
    grad.addColorStop(0, '#ffb6c1');
    grad.addColorStop(1, '#ffc0cb');
  } else if (progress < 0.66) {
    grad.addColorStop(0, '#b19cd9');
    grad.addColorStop(1, '#8a2be2');
  } else {
    grad.addColorStop(0, '#000010');
    grad.addColorStop(1, '#000000');
  }
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function draw() {
  drawBackground();
  ctx.save();
  ctx.translate(0, -cameraY);
  for (let p of platforms) {
    if (p.type === 'break' && p.broken) continue;
    if (p.type === 'moving') ctx.fillStyle = '#00ffcc';
    else if (p.type === 'break') ctx.fillStyle = '#ffcc00';
    else if (p.type === 'final') ctx.fillStyle = '#00ff00';
    else ctx.fillStyle = 'white';
    ctx.fillRect(p.x, p.y, p.width, p.height);
  }
  drawHeart(player.x, player.y);
  ctx.restore();

  // Частицы
  ctx.fillStyle = 'red';
  for (let p of particles) {
    ctx.globalAlpha = p.life / 35;
    ctx.fillRect(p.x, p.y - cameraY, 3, 3);
  }
  ctx.globalAlpha = 1;
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
